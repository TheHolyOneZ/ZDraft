[package]
name = "zdraft"
description = "Diagrams as code, with a canvas you are allowed to touch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "zdraft-desktop"
path = "src/main.rs"

[lib]
name = "zdraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zdraft-io = { path = "../crates/zdraft-io" }

# `image-png`: the clipboard takes an image as raw RGBA by default, and a 2×
# diagram is fifteen megabytes of that — serialised over the bridge as a JSON
# array of numbers. PNG bytes are a few hundred KB and decode natively.
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
