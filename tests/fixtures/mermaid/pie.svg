<svg id="capture-pie" width="589.046875" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 589.046875 450" height="450" role="graphics-document document" aria-roledescription="pie"><style>#capture-pie{font-family:Inter,'Inter Variable','Segoe UI',system-ui,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#capture-pie .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#capture-pie .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#capture-pie .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#capture-pie .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#capture-pie .edge-thickness-normal{stroke-width:1px;}#capture-pie .edge-thickness-thick{stroke-width:3.5px;}#capture-pie .edge-pattern-solid{stroke-dasharray:0;}#capture-pie .edge-thickness-invisible{stroke-width:0;fill:none;}#capture-pie .edge-pattern-dashed{stroke-dasharray:3;}#capture-pie .edge-pattern-dotted{stroke-dasharray:2;}#capture-pie .marker{fill:#0b0b0b;stroke:#0b0b0b;}#capture-pie .marker.cross{stroke:#0b0b0b;}#capture-pie svg{font-family:Inter,'Inter Variable','Segoe UI',system-ui,sans-serif;font-size:16px;}#capture-pie p{margin:0;}#capture-pie .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#capture-pie .pieCircle.highlighted{scale:1.05;opacity:1;}#capture-pie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#capture-pie .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#capture-pie .pieTitleText{text-anchor:middle;font-size:25px;fill:#333;font-family:Inter,'Inter Variable','Segoe UI',system-ui,sans-serif;}#capture-pie .slice{font-family:Inter,'Inter Variable','Segoe UI',system-ui,sans-serif;fill:#333;font-size:17px;}#capture-pie .legend text{fill:#333;font-family:Inter,'Inter Variable','Segoe UI',system-ui,sans-serif;font-size:17px;}#capture-pie .node .neo-node{stroke:hsl(40.5882352941, 60%, 83.3333333333%);}#capture-pie [data-look="neo"].node rect,#capture-pie [data-look="neo"].cluster rect,#capture-pie [data-look="neo"].node polygon{stroke:url(#capture-pie-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#capture-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#capture-pie [data-look="neo"].node path{stroke:url(#capture-pie-gradient);stroke-width:1px;}#capture-pie [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#capture-pie [data-look="neo"].node .neo-line path{stroke:hsl(40.5882352941, 60%, 83.3333333333%);filter:none;}#capture-pie [data-look="neo"].node circle{stroke:url(#capture-pie-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#capture-pie [data-look="neo"].node circle .state-start{fill:#000000;}#capture-pie [data-look="neo"].icon-shape .icon{fill:url(#capture-pie-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#capture-pie [data-look="neo"].icon-shape .icon-neo path{stroke:url(#capture-pie-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#capture-pie :root{--mermaid-font-family:Inter,'Inter Variable','Segoe UI',system-ui,sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,0,1,57.168,175.945L0,0Z" fill="#fff4dd" class="pieCircle"></path><path d="M57.168,175.945A185,185,0,0,1,0,185L0,0Z" fill="hsl(-79.4117647059, 100%, 93.3333333333%)" class="pieCircle"></path><path d="M0,185A185,185,0,1,1,0,-185L0,0Z" fill="hsl(220.5882352941, 100%, 98.3333333333%)" class="pieCircle"></path><text transform="translate(137.04175725757537,-21.705282024332003)" class="slice" style="text-anchor: middle;">45%</text><text transform="translate(21.70528202433198,137.04175725757537)" class="slice" style="text-anchor: middle;">5%</text><text transform="translate(-138.75,-1.0624278139522284e-13)" class="slice" style="text-anchor: middle;">50%</text></g><text x="0" y="-200" class="pieTitleText">Storage</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(255, 244, 221); stroke: rgb(255, 244, 221);"></rect><text x="22" y="14">Diagrams</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(244, 221, 255); stroke: rgb(244, 221, 255);"></rect><text x="22" y="14">Sidecars</text></g><g class="legend" transform="translate(216,11)"><rect width="18" height="18" style="fill: rgb(247, 249, 255); stroke: rgb(247, 249, 255);"></rect><text x="22" y="14">Free</text></g></g></svg>
