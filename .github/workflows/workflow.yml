name: Installers


on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm
          - name: Windows
            os: windows-latest
            bundles: nsis
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building ZDraft $version"

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="${{ steps.version.outputs.value }}"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$tag" != "$app" ] || [ "$tag" != "$conf" ]; then
            echo "::error::Tag v$tag, package.json $app, tauri.conf.json $conf. Bump them together first."
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: ${{ matrix.name }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and test
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: |
          pnpm exec tsc --noEmit
          pnpm test
          cargo test --workspace

      - name: Build the installers
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Check the glibc requirement
        if: runner.os == 'Linux'
        run: |
          need="$(objdump -T target/release/zdraft-desktop | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)"
          echo "The binary needs $need"
          if [ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::$need is newer than Ubuntu 22.04's glibc 2.35."
            exit 1
          fi

      - name: Collect
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp target/release/bundle/deb/*.deb \
               target/release/bundle/rpm/*.rpm out/
          else
            cp target/release/bundle/nsis/*-setup.exe out/
          fi
          cd out
          sha256sum * > "SHA256SUMS-${{ matrix.name }}.sha256"
          ls -la
          cat SHA256SUMS-*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: zdraft-${{ steps.version.outputs.value }}-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 90
